[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-object-detection"
version = "0.1.0"
description = "A learning-first aircraft detection pipeline for overhead imagery"
requires-python = ">=3.13"
dependencies = ["torch>=2.6", "torchvision>=0.21", "Pillow>=11"]

[tool.setuptools.packages.find]
where = ["src"]
